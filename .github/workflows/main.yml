name: Build TR.SUB APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"

          if [ -n "$ZIP_FILE" ]; then
            mkdir -p extracted_project
            unzip -oq "$ZIP_FILE" -d extracted_project

            SETTINGS_FILE="$(find extracted_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle not found in ZIP"
              find extracted_project -maxdepth 4 -type f | head -n 100
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            cp -a "$PROJECT_DIR"/. .
          fi

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Android project not found in repository root"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -e

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            echo "ERROR: Gradle wrapper is missing"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRSUB-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
