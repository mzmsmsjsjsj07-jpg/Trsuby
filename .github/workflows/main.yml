name: Build TR.SUB APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract TR.SUB project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            unzip -t "$ZIP_FILE"
            mkdir -p extracted_project
            unzip -oq "$ZIP_FILE" -d extracted_project

            GRADLE_FILE="$(find extracted_project -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)"

            if [ -z "$GRADLE_FILE" ]; then
              echo "ERROR: Gradle project files not found in ZIP."
              find extracted_project -maxdepth 4 -type f
              exit 1
            fi

            PROJECT_DIR="$(dirname "$GRADLE_FILE")"
            cp -a "$PROJECT_DIR"/. .
          fi

          if [ ! -f settings.gradle ] || [ ! -f app/build.gradle ]; then
            echo "ERROR: Android project is missing from repository."
            echo "Upload TRSUB_v8.1.zip to the repository root, or commit the extracted project files."
            find . -maxdepth 3 -type f -not -path './.git/*'
            exit 1
          fi

          echo "Project files found successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle --version
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRSUB-v8.1-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
