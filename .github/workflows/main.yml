name: Build TR.SUB APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"

          if [ -n "$ZIP_FILE" ]; then
            mkdir -p extracted_project
            unzip -oq "$ZIP_FILE" -d extracted_project

            SETTINGS="$(find extracted_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Gradle settings file not found in ZIP"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"
            cp -a "$PROJECT_DIR"/. .
          fi

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager executable not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRSUB-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
